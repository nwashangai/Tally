name: tally
description: "A small-business inventory tallying and stock-balancing application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State & Dependency Injection (Application/Presentation only)
  flutter_riverpod: ^2.6.1

  # Routing & Navigation
  go_router: ^14.8.1

  # Networking (Infrastructure only)
  dio: ^5.8.0+1

  # Network connectivity observation
  connectivity_plus: ^6.1.3

  # Secure token storage (Auth credentials/tokens)
  flutter_secure_storage: ^9.2.4

  # Local preferences (UI flags, selected store preference)
  shared_preferences: ^2.5.2

  # Local file paths (Documents directory for store storage files)
  path_provider: ^2.1.5

  # Deterministic Identifiers & Idempotency Keys
  uuid: ^4.5.1

  # Internationalization & formatting
  intl: ^0.20.2

  # Integrity & Checksum verification for snapshots
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
